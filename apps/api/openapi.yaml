openapi: 3.1.0
info:
  title: AI Audit Trail Control Plane API
  version: 0.1.0
  description: Organizations, projects, API keys, and membership management.

servers:
  - url: http://localhost:3000

paths:
  /public/organizations:
    post:
      summary: Create organization (onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: Organization created

  /organizations/{orgId}/projects:
    get:
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/OrgId'
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Project list
    post:
      summary: Create project
      parameters:
        - $ref: '#/components/parameters/OrgId'
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      responses:
        '201':
          description: Project created

  /organizations/{orgId}/api-keys:
    get:
      summary: List API keys
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      security:
        - sessionAuth: []
      responses:
        '200':
          description: API key list
    post:
      summary: Issue API key
      parameters:
        - $ref: '#/components/parameters/OrgId'
      security:
        - sessionAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKey'
      responses:
        '201':
          description: API key issued (plaintext returned once)

  /v1/traces:
    get:
      summary: Search traces
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [in_progress, completed, failed, cancelled]
        - name: workflow_name
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: started_after
          in: query
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Trace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceListResponse'
    post:
      summary: Ingest trace envelope
      security:
        - apiKeyAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceIngestEnvelope'
      responses:
        '202':
          description: Trace accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestTraceResponse'
        '400':
          description: Validation error
        '409':
          description: Duplicate event_id
        '413':
          description: Payload too large
        '429':
          description: Rate limited

  /v1/traces/{id}:
    get:
      summary: Get trace detail with event timeline
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceDetail'
        '404':
          description: Trace not found

  /v1/traces/{id}/replay:
    get:
      summary: Get replay timeline
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Replay timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayTimeline'
        '404':
          description: Trace not found

  /organizations/{orgId}/members/invite:
    post:
      summary: Invite member
      parameters:
        - $ref: '#/components/parameters/OrgId'
      security:
        - sessionAuth: []
      responses:
        '201':
          description: Invitation created

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: X-User-Id
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key

  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    CreateOrganization:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

    CreateProject:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string

    CreateApiKey:
      type: object
      required: [name, projectId, scopes]
      properties:
        name:
          type: string
        projectId:
          type: string
          format: uuid
        environmentId:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
            enum: [trace:ingest, trace:read, export:create]

    IngestTraceResponse:
      type: object
      required: [trace_id, received_at]
      properties:
        trace_id:
          type: string
        received_at:
          type: string
          format: date-time

    TraceIngestEnvelope:
      type: object
      description: See packages/schema/schemas/v1/trace-envelope.schema.json

    TraceListResponse:
      type: object
      required: [traces, next_cursor]
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/TraceListItem'
        next_cursor:
          type: string
          nullable: true

    TraceListItem:
      type: object
      properties:
        trace_id:
          type: string
        workflow_name:
          type: string
        status:
          type: string
        started_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        project_id:
          type: string
          format: uuid
        chain_hash:
          type: string
          nullable: true

    TraceDetail:
      type: object
      properties:
        trace_id:
          type: string
        workflow_name:
          type: string
        status:
          type: string
        permission_snapshot:
          $ref: '#/components/schemas/PermissionSnapshot'
        events:
          type: array
          items:
            $ref: '#/components/schemas/TraceEventTimelineItem'

    PermissionSnapshot:
      type: object
      properties:
        policy_version:
          type: string
        roles:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string

    TraceEventTimelineItem:
      type: object
      properties:
        event_id:
          type: string
        type:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          nullable: true

    ReplayTimeline:
      type: object
      properties:
        trace_id:
          type: string
        workflow_name:
          type: string
        permission_snapshot:
          $ref: '#/components/schemas/PermissionSnapshot'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'

    ReplayStep:
      type: object
      properties:
        event_id:
          type: string
        prev_event_id:
          type: string
          nullable: true
        next_event_id:
          type: string
          nullable: true
